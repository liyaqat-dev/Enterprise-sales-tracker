  <!-- ── Safe-area insets for notched devices ─────────── -->
  <style>
    :root {
      --sat: env(safe-area-inset-top);
      --sar: env(safe-area-inset-right);
      --sab: env(safe-area-inset-bottom);
      --sal: env(safe-area-inset-left);
    }
    html, body, #root {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #FAF8F5;
    }
    /* Prevent flash of unstyled content */
    #root:empty::before {
      content: '';
      display: block;
    }
  </style>
</head>
<body>

  <!-- React app mounts here -->
  <div id="root"></div>

  <!--
    ╔══════════════════════════════════════════════════════════════════╗
    ║  SERVICE WORKER REGISTRATION                                     ║
    ║  Place this script at the end of <body>.                         ║
    ║  The SW must be served from the same origin as your app.         ║
    ║  File: /sw.js  (in public/ root for CRA / Vite)                  ║
    ╚══════════════════════════════════════════════════════════════════╝
  -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('/sw.js', { scope: '/' })
          .then(registration => {
            console.log('[PWA] Service Worker registered. Scope:', registration.scope);

            // Listen for SW updates and prompt user to refresh
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              if (!newWorker) return;

              newWorker.addEventListener('statechange', () => {
                if (
                  newWorker.state === 'installed' &&
                  navigator.serviceWorker.controller
                ) {
                  // New content available — you can surface a toast here
                  console.log('[PWA] New version available. Refresh to update.');
                }
              });
            });
          })
          .catch(err => {
            console.warn('[PWA] Service Worker registration failed:', err);
          });
      });

      // Reload page when a new SW takes control (after the user refreshes)
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    }
  </script>

</body>
</html>
