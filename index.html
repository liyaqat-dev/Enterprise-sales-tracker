<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- ── Primary Meta ─────────────────────────────────── -->
  <title>Enterprise Sales-Tracker</title>
  <meta name="description" content="Supervisor-grade product disbursement tracker with real-time sync." />
  <meta name="theme-color" content="#5C4033" />
  <meta name="color-scheme" content="light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="SalesTracker" />

  <!-- ── Apple PWA Meta ───────────────────────────────── -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SalesTracker" />
  <link rel="apple-touch-icon" href="https://github.com/liyaqat-dev/Enterprise-sales-tracker/blob/main/20260526_182400.png?raw=true" />

  <!-- ── Microsoft Tiles ──────────────────────────────── -->
  <meta name="msapplication-TileColor" content="#5C4033" />
  <meta name="msapplication-TileImage" content="https://github.com/liyaqat-dev/Enterprise-sales-tracker/blob/main/20260526_182400.png?raw=true" />
  <meta name="msapplication-tap-highlight" content="no" />

  <!-- ── Open Graph ───────────────────────────────────── -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Enterprise Sales-Tracker" />
  <meta property="og:description" content="Supervisor-grade product disbursement tracker." />
  <meta property="og:image" content="https://github.com/liyaqat-dev/Enterprise-sales-tracker/blob/main/20260526_182400.png?raw=true" />

  <!-- ── PWA Manifest (THIS is the key line for install prompt) ── -->
  <link rel="manifest" href="/manifest.json" />

  <!-- ── Favicon ──────────────────────────────────────── -->
  <link rel="icon" type="image/png" href="https://github.com/liyaqat-dev/Enterprise-sales-tracker/blob/main/20260526_182400.png?raw=true" />

  <!-- ── Safe-area insets for notched devices ─────────── -->
  <style>
    :root {
      --sat: env(safe-area-inset-top);
      --sab: env(safe-area-inset-bottom);
    }
    html, body { margin: 0; padding: 0; background-color: #FAF8F5; }
  </style>
</head>
<body>

  <!-- ── React mounts here — Vite injects the bundle script automatically ── -->
  <div id="root"></div>

  <!-- ── THIS IS THE CRITICAL LINE VITE NEEDS — DO NOT REMOVE ── -->
  <script type="module" src="/src/main.tsx"></script>

  <!-- ── Service Worker Registration ─────────────────── -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('/sw.js', { scope: '/' })
          .then(reg => {
            console.log('[PWA] SW registered. Scope:', reg.scope);
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('[PWA] New version available. Refresh to update.');
                }
              });
            });
          })
          .catch(err => console.warn('[PWA] SW registration failed:', err));
      });

      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    }
  </script>

</body>
</html>
